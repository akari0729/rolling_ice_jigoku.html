<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ローリング・アイス地獄 DX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff3fa,#e7f6ff);font-family:system-ui,sans-serif;color:#30263a}main{max-width:950px;margin:auto;padding:12px}header{text-align:center}h1{color:#7046a4;margin:4px;font-size:clamp(1.5rem,5vw,2.5rem)}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.panel{background:#ffffffdf;border:2px solid white;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 7px 22px #60408014}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#fff0f7;border-radius:12px;padding:7px}.stat small{display:block;color:#856b8d}.stat strong{font-size:1.1rem}#plate{border:6px solid #9caebb;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#cbd6df,#f8fafc,#afbfcc)}canvas{display:block;width:100%;height:auto;touch-action:none}button{font:inherit;font-weight:750;border:0;border-radius:12px;padding:11px;cursor:pointer;touch-action:manipulation}.row{display:flex;gap:7px;flex-wrap:wrap}.primary{background:#8054c4;color:white;flex:1}.secondary{background:#ffe2ef;color:#743a61}.top{background:#fff0c9}.top.selected{outline:3px solid #8054c4}#msg{min-height:3em;text-align:center;font-weight:750;padding:8px 0 0}.note{font-size:.9rem;line-height:1.6;color:#76637d}#result{display:none;text-align:center;background:#fff0f7;border-radius:14px;padding:12px}.bar{height:8px;background:#e7ddeb;border-radius:8px;margin:8px 0;overflow:hidden}#fill{height:100%;width:100%;background:linear-gradient(90deg,#7ddacb,#ffd27c,#ff7198)}@media(max-width:680px){.layout{grid-template-columns:1fr}main{padding:8px}.panel{margin:7px 0}}
</style></head><body><main>
<header><div style="font-size:2rem">🍨 🥄 🧊</div><h1>ローリング・アイス地獄 DX</h1><p>ヘラを信じろ。アイスは裏切る。</p></header>
<div class="stats"><div class="stat"><small>工程</small><strong id="step">液を広げる</strong></div><div class="stat"><small>事故レベル</small><strong id="chaos">0</strong></div><div class="stat"><small>ロール数</small><strong id="count">0</strong></div></div>
<div class="layout"><section class="panel"><div class="bar"><div id="fill"></div></div><div id="plate"><canvas id="game" width="720" height="480"></canvas></div><div id="msg">指やマウスで鉄板をなぞってアイス液を広げよう！</div><div class="row"><button class="primary" id="next">凍らせる！</button><button class="secondary" id="reset">最初から</button></div><div id="result"><h2 id="ending"></h2><div id="summary"></div></div></section>
<aside><section class="panel"><h3 style="margin:0 0 8px">🍓 トッピング</h3><div class="row" id="tops"><button class="top selected" data-t="🍓">🍓</button><button class="top" data-t="🍫">🍫</button><button class="top" data-t="🌶️">🌶️</button><button class="top" data-t="🥦">🥦</button><button class="top" data-t="🧄">🧄</button></div><p class="note">① なぞって液を広げる<br>② 凍らせる<br>③ ヘラを押し当て、短くまっすぐ引いて巻く<br>④ トッピングして判定！</p><p class="note">長く引きすぎると崩れる。逆方向から引くと店長が見てるぞ。</p></section><section class="panel"><h3 style="margin:0 0 8px">💥 事故ログ</h3><div id="log" class="note">まだ平和。今のところは。</div></section></aside></div><p class="note" style="text-align:center">スマホは指、PCはマウス。事故は仕様です。</p></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),msg=document.querySelector('#msg'),next=document.querySelector('#next');const W=720,H=480;
let phase=0,drag=false,last=null,spread=0,chaos=0,rolls=[],splats=[],trail=[],selected='🍓',time=100,done=false,logs=[],color='#ff91bd';
const colors=['#ff91bd','#d4b4ff','#a4e6db','#ffe19b','#ffb09f'];
function say(s){msg.textContent=s}function log(s){logs.unshift(s);logs=logs.slice(0,4);document.querySelector('#log').innerHTML=logs.join('<br>')}
function ui(){document.querySelector('#step').textContent=['液を広げる','凍結完了','削って巻く','盛り付け','閉店'][phase];document.querySelector('#chaos').textContent=chaos;document.querySelector('#count').textContent=rolls.length;document.querySelector('#fill').style.width=time+'%'}
function reset(){phase=0;drag=false;last=null;spread=0;chaos=0;rolls=[];splats=[];trail=[];time=100;done=false;logs=[];color=colors[0];next.disabled=false;next.textContent='凍らせる！';document.querySelector('#result').style.display='none';say('指やマウスで鉄板をなぞってアイス液を広げよう！');log('まだ平和。今のところは。');ui();draw()}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function mess(px,py){for(let i=0;i<12;i++)splats.push({x:px+(Math.random()-.5)*90,y:py+(Math.random()-.5)*70,r:5+Math.random()*20,col:colors[Math.floor(Math.random()*colors.length)]})}
c.addEventListener('pointerdown',e=>{if(done)return;drag=true;last=pos(e);c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag||done)return;let p=pos(e),d=Math.hypot(p.x-last.x,p.y-last.y);
if(phase===0){spread=Math.min(100,spread+d*.13);splats.push({x:p.x,y:p.y,r:12+Math.random()*18,col:color});if(d>48){chaos++;log('液が鉄板の端に激突。壁は無実。');}}
else if(phase===2){if(d>55){chaos+=2;mess(p.x,p.y);say('引きすぎィ！！ アイスが裂けた！');log('長く引きすぎてアイスが裂けた。')}else if(d>12){rolls.push({x:p.x,y:p.y,a:Math.atan2(p.y-last.y,p.x-last.x),r:13+Math.random()*9,col:color});if(rolls.length>14){chaos+=2;mess(p.x,p.y);say('ロールの定員オーバー！')}else say('いいぞ！ 短く引いて巻け！')}else{chaos++;say('ヘラが震えてるぞ。落ち着け！')}trail.push({x:p.x,y:p.y});if(trail.length>45)trail.shift()}
last=p;ui();draw()});
c.addEventListener('pointerup',()=>{drag=false;last=null});
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#d8e0e7');g.addColorStop(.45,'#f9fbfd');g.addColorStop(1,'#b6c4d1');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<65;i++){x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.moveTo(0,i*7);x.lineTo(W,i*7+2);x.stroke()}x.strokeStyle='#899aaa';x.lineWidth=10;x.strokeRect(6,6,W-12,H-12);
if(phase===0){for(let s of splats){x.globalAlpha=.8;x.fillStyle=s.col;x.beginPath();x.ellipse(s.x,s.y,s.r*1.4,s.r*.7,0,0,Math.PI*2);x.fill()}x.globalAlpha=1;x.fillStyle='#5d6874';x.textAlign='center';x.font='bold 20px system-ui';if(spread<1)x.fillText('ここをなぞって液を広げる',W/2,H/2)}
else{x.save();x.beginPath();x.moveTo(70,70);x.quadraticCurveTo(300,35,650,82);x.lineTo(655,385);x.quadraticCurveTo(380,445,66,390);x.closePath();x.clip();let ig=x.createLinearGradient(60,60,620,420);ig.addColorStop(0,color);ig.addColorStop(.5,'#fff0f8');ig.addColorStop(1,color);x.fillStyle=ig;x.fillRect(40,40,640,400);for(let i=0;i<80;i++){x.strokeStyle='rgba(255,255,255,.22)';x.lineWidth=1+Math.random()*3;x.beginPath();let a=Math.random()*W,b=Math.random()*H;x.moveTo(a,b);x.lineTo(a+10+Math.random()*30,b+Math.random()*5);x.stroke()}x.restore();for(let t of trail){x.fillStyle='#b28ac5';x.beginPath();x.arc(t.x,t.y,7,0,7);x.fill()}for(let r of rolls){x.save();x.translate(r.x,r.y);x.rotate(r.a);x.fillStyle=r.col;x.shadowColor='#554';x.shadowBlur=7;x.beginPath();x.ellipse(0,0,r.r*1.3,r.r*.65,0,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.ellipse(0,0,r.r*.6,r.r*.3,0,0,7);x.stroke();x.restore()}for(let s of splats){x.fillStyle=s.col;x.globalAlpha=.8;x.beginPath();x.ellipse(s.x,s.y,s.r*1.3,s.r*.8,Math.random(),0,7);x.fill()}x.globalAlpha=1;if(phase===3){x.textAlign='center';x.font='36px system-ui';x.fillText(selected,W/2,H/2)}}if(chaos>=3){x.fillStyle=chaos>7?'rgba(255,0,0,.16)':'rgba(255,165,0,.12)';x.fillRect(0,0,W,H);if(chaos>5){x.fillStyle='#702222';x.font='bold 18px system-ui';x.textAlign='left';x.fillText(chaos>8?'店長「何してんの！？」':'厨房がざわついている…',22,34)}}if(drag&&last){x.save();x.translate(last.x,last.y);x.rotate(-.35);x.fillStyle='#687d8d';x.fillRect(-7,-70,14,55);x.fillStyle='#dce4eb';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.roundRect(-28,-20,56,24,5);x.fill();x.stroke();x.restore()}}
next.addEventListener('click',()=>{if(phase===0){if(spread<30){chaos+=2;mess(W/2,H/2);say('液が少ない！ でも店長が凍らせろって言ってる！');log('液が少ないまま凍結。店長の判断。')}else say('凍結完了！ ヘラを短く引いて巻こう。');phase=2;color=colors[Math.min(4,Math.floor(spread/22))];next.textContent='盛り付ける！'}else if(phase===2){if(rolls.length<3){chaos+=3;mess(W/2,H/2);say('ロールが足りない！ 皿の上はほぼ雪崩。');log('ロール不足。客は静かに泣いている。')}else say('盛り付けだ！ トッピングで運命が決まる。');phase=3;next.textContent='最終判定！'}else if(phase===3){phase=4;done=true;next.disabled=true;let weird=['🌶️','🥦','🧄'].includes(selected);if(weird){chaos+=4;mess(W/2,H/2);log('トッピングが原因で厨房が緊急会議。')}document.querySelector('#ending').textContent=chaos>8?'💥 伝説の事故作':rolls.length>=5&&chaos<4?'🍨 奇跡の職人':'🫠 これは……何？';document.querySelector('#summary').innerHTML=`ロール：<b>${rolls.length}本</b><br>事故レベル：<b>${chaos}</b><br>トッピング：${selected}<br><br>${chaos>8?'店長「明日からメニューを変えます」':rolls.length>=5&&chaos<4?'客「これ本当に君が作ったの？」':'客「……スプーンください」'}`;document.querySelector('#result').style.display='block';say('完成！ 厨房の明日はどっちだ。');log('謎の完成品ができた。')}ui();draw()});
document.querySelectorAll('.top').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.t;document.querySelectorAll('.top').forEach(q=>q.classList.toggle('selected',q===b));say('トッピングは '+selected+'！ その判断でいいのか？');draw()}));document.querySelector('#reset').addEventListener('click',reset);ui();draw();
})();
</script></body></html>
